name: Daily Financial Update

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    # Changed from ubuntu-latest to windows-latest to match your PC
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install google-genai scrapetube youtube-transcript-api ipykernel PyYAML pandas
          python -m ipykernel install --user --name python3

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Run Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Windows handles this path the same way in the shell
        run: python 2_notebooks/YTscrape.py 

      - name: Render Quarto to HTML
        run: quarto render index.qmd

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 3_outputs/financial_summaries.json index.html
          git commit -m "Automated update: $(date)" || echo "No changes to commit"
          git push